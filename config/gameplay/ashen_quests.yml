    where_en: "Ashen Shore at the gate"
    giver: "Ратуша Угля"
    requires: [ash_healer_first_bag]
    objective:
      type: kill_npc
      npc_keys: [plague_rat, ash_gate_mite]
      count: 3
    reward:
      experience: 40
      currency_nv: 25
      item_key: set-blood-ring-t5
    unlocks: [ash_scout_watch, bell_yard_crumbs]
    sort: 10

  ash_scout_watch:
    title_ru: "Разведка берега"
    title_en: "Shore Recon"
    summary_ru: "Сбейте пепельного разведчика у Пепельного Берега и доложите в Ратушу."
    summary_en: "Defeat the ash shore scout and report to City Hall."
    where_ru: "Пепельный Берег"
    where_en: "Ashen Shore"
    giver: "Ратуша Угля"
    requires: [ash_mite_patrol]
    objective:
      type: kill_npc
      npc_keys: [ash_shore_scout]
      count: 1
    reward:
      experience: 35
      currency_nv: 20
      item_key: set-distortion-gloves-t5
    unlocks: [salt_smuggler_trace]
    sort: 15

  salt_smuggler_trace:
    title_ru: "След соли"
    title_en: "Salt Trail"
    summary_ru: "Сбейте солевых контрабандистов и патруль Завесы, затем вернитесь с докладом."
    summary_en: "Defeat salt smugglers and Veil patrols, then report back."
    where_ru: "Пепельный Берег (глубже)"
    where_en: "Ashen Shore (deeper)"
    giver: "Ратуша Угля"
    requires: [ash_scout_watch]
    objective:
      type: kill_npc
      npc_keys: [wilderness_robber, wilderness_bandit]
      count: 2
    reward:
      experience: 80
      currency_nv: 45
      item_key: set-judge-amulet-t5
    unlocks: [bell_mite_cull]
    sort: 20

  bell_yard_crumbs:
    title_ru: "Крошки колокольного двора"
    title_en: "Bell Yard Crumbs"
    summary_ru: "Принесите в Ратушу два «Хвоста Крысы Завесы» — следы клещей у берега."
    summary_en: "Bring two Veil Rat Tails to City Hall — ash mite traces from the shore."
    where_ru: "Берег → Ратуша"
    where_en: "Shore → City Hall"
    giver: "Ратуша Угля"
    requires: [ash_mite_patrol]
    objective:
      type: deliver_item
      item_key: rat_tail
      count: 2
    reward:
      experience: 55
      currency_nv: 30
      item_key: set-swamp-amulet-t5
    sort: 25

  bell_mite_cull:
    title_ru: "Колокольный выводок"
    title_en: "Bell Mite Cull"
    summary_ru: "Уничтожьте двух колокольных клещей у берега и вернитесь с докладом."
    summary_en: "Defeat two bell mites on the shore and report back."
    where_ru: "Пепельный Берег"
    where_en: "Ashen Shore"
    giver: "Ратуша Угля"
    requires: [salt_smuggler_trace]
    objective:
      type: kill_npc
      npc_keys: [ash_bell_mite]
      count: 2
    reward:
      experience: 70
      currency_nv: 35
      item_key: set-judge-helm-t5
    unlocks: [salt_pier_haunt]
    sort: 28

  veil_patrol_sweep:
    title_ru: "Зачистка патруля"
    title_en: "Patrol Sweep"
    summary_ru: "Победите четырёх врагов патруля/контрабанды на Пепельном Береге."
    summary_en: "Defeat four patrol or smuggler foes on the Ashen Shore."
    where_ru: "Пепельный Берег"
    where_en: "Ashen Shore"
    giver: "Ратуша Угля"
    requires: [ash_healer_master_bag]
    objective:
      type: kill_npc
      npc_keys: [wilderness_bandit, wilderness_robber, ash_shore_scout]
      count: 4
    reward:
      experience: 120
      currency_nv: 60
      item_key: set-blood-bracers-t5
    unlocks: [soot_knifer_bounty]
    sort: 30

  salt_pier_haunt:
    title_ru: "Призраки соляного пирса"
    title_en: "Salt Pier Haunt"
    summary_ru: "Сбейте двух солевых призраков у пирса и доложите в Ратушу."
    summary_en: "Defeat two salt dock wraiths near the pier and report to City Hall."
    where_ru: "Пирс / соляной берег"
    where_en: "Pier / salt shore"
    giver: "Ратуша Угля"
    requires: [bell_mite_cull]
    objective:
      type: kill_npc
      npc_keys: [salt_dock_wraith]
      count: 2
    reward:
      experience: 90
      currency_nv: 50
      item_key: set-swamp-amulet-t5
    unlocks: [dust_chanter_silence]
    sort: 35

  soot_knifer_bounty:
    title_ru: "Награда за ножевика"
    title_en: "Knifer Bounty"
    summary_ru: "Устраните ножевика Сажевого рынка на берегу и вернитесь с докладом."
    summary_en: "Eliminate a soot-market knifer on the shore and report back."
    where_ru: "Пепельный Берег (рынок-сажа)"
    where_en: "Ashen Shore (soot market)"
    giver: "Ратуша Угля"
    requires: [veil_patrol_sweep]
    objective:
      type: kill_npc
      npc_keys: [soot_market_knifer]
      count: 1
    reward:
      experience: 100
      currency_nv: 55
      item_key: set-distortion-gloves-t5
    sort: 40

  dust_chanter_silence:
    title_ru: "Заглушить пыль"
    title_en: "Silence the Dust"
    summary_ru: "Сбейте двух пылевых певцов Завесы и доложите в Ратушу."
    summary_en: "Defeat two Veil dust chanters and report back."
