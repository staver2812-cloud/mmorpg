# Sandbox Ashen Veil starter quests (Пепельная Завеса).
# Lightweight journal progress stored on character.metadata["ashen_quests"].
# requires: list of completed quest keys before accept is allowed.
# unlocks: quest keys auto-accepted after a successful turn-in.
# where_*: short HUD/board hint for where to go next.

quests:
  veil_lure_drill:
    title_ru: "Приманка Завесы"
    title_en: "Veil Lure Drill"
    summary_ru: "Боты сами нападают раз в 5 минут. Чтобы вызвать бой раньше — используйте Приманку Завесы (Осмотр/Вход на клетке с ботом). Победите врага берега или манекен в Зале Помощи и доложите."
    summary_en: "Bots ambush on their own every 5 minutes. To force a fight earlier, use Ashen Bait (Look/Enter on a hostile cell). Defeat a shore foe or the Help Hall mannequin and report."
    where_ru: "Западные ворота → Пепельный Берег · или Арена → Зал Помощи"
    where_en: "West Gate → Ashen Shore · or Arena → Help Hall"
    giver: "Ратуша Угля"
    objective:
      type: kill_npc
      npc_keys: [plague_rat, ash_gate_mite, ash_gate_patrol, ash_shore_scout, wilderness_bandit, wilderness_robber, ash_bell_mite, arena_training_dummy]
      count: 1
    reward:
      experience: 25
      currency_nv: 20
    unlocks: [veil_tail_delivery]
    sort: 1

  veil_tail_delivery:
    title_ru: "Хвост Завесы"
    title_en: "Veil Tail Delivery"
    summary_ru: "Добыйте «Хвост Крысы Завесы» с клещей у ворот и сдайте в Ратушу."
    summary_en: "Collect a Veil Rat Tail from gate mites and turn it in at City Hall."
    where_ru: "Ворота → бой → Ратуша"
    where_en: "Gate → fight → City Hall"
    giver: "Ратуша Угля"
    requires: [veil_lure_drill]
    objective:
      type: deliver_item
      item_key: rat_tail
      count: 1
    reward:
      experience: 30
      currency_nv: 15
    unlocks: [tar_smith_first_bandage]
    sort: 2

  tar_smith_first_bandage:
    title_ru: "Первый бинт Смолокура"
    title_en: "First Tar Smith Bandage"
    summary_ru: "Скрафтите «Пепельный бинт» в Смоляной Кузнице (щепа + хвост) и сдайте его в Ратушу."
    summary_en: "Craft an Ashen Bandage at the Pitch Forge (chips + tail) and turn it in at City Hall."
    where_ru: "Смоляная Кузница"
    where_en: "Pitch Forge"
    giver: "Ратуша Угля"
    requires: [veil_tail_delivery]
    objective:
      type: deliver_item
      item_key: ashen_bandage
      count: 1
    reward:
      experience: 35
      currency_nv: 25
      item_key: wood_chips
    unlocks: [ash_healer_first_bag, tar_field_kit_contract]
    sort: 3

  ash_healer_first_bag:
    title_ru: "Первая сумка Лекаря"
    title_en: "First Healer Bag"
    summary_ru: "Скрафтите «Сумку новичка-лекаря» в Лазарете Угля (бинт + трава + щепа) и сдайте её в Ратушу."
    summary_en: "Craft a Novice Healer Bag at Coal Infirmary (bandage + herb + chips) and turn it in at City Hall."
    where_ru: "Лазарет Угля"
    where_en: "Coal Infirmary"
    giver: "Ратуша Угля"
    requires: [tar_smith_first_bandage]
    objective:
      type: deliver_item
      item_key: healer_bag_light
      count: 1
    reward:
      experience: 40
      currency_nv: 30
      item_key: ash_herb
    unlocks: [ash_mite_patrol]
    sort: 4

  tar_field_kit_contract:
    title_ru: "Полевой набор Смолокура"
    title_en: "Tar Smith Field Kit"
    summary_ru: "Скрафтите «Полевой набор Завесы» в Кузнице (2 бинта + приманка, навык ≥3) и сдайте его в Ратушу."
    summary_en: "Craft a Veil Field Kit at the Forge (2 bandages + bait, skill ≥3) and turn it in at City Hall."
    where_ru: "Смоляная Кузница"
    where_en: "Pitch Forge"
    giver: "Ратуша Угля"
    requires: [tar_smith_first_bandage]
    objective:
      type: deliver_item
      item_key: veil_field_kit
      count: 1
    reward:
      experience: 45
      currency_nv: 30
      item_key: ashen_bait
    unlocks: [tar_lure_pack_contract, ash_healer_adept_bag]
    sort: 5

  tar_lure_pack_contract:
    title_ru: "Пачка приманок"
    title_en: "Lure Pack Run"
    summary_ru: "Скрафтите «Пачку смоляных приманок» и сдайте 5 приманок в Ратушу (навык Смолокура ≥1)."
    summary_en: "Craft a Tar Lure Pack and turn in 5 Ashen Bait at City Hall (Tar Smith skill ≥1)."
    where_ru: "Смоляная Кузница"
    where_en: "Pitch Forge"
    giver: "Ратуша Угля"
    requires: [tar_field_kit_contract]
    objective:
      type: deliver_item
      item_key: ashen_bait
      count: 5
    reward:
      experience: 40
      currency_nv: 35
      item_key: wood_chips
    sort: 6

  ash_healer_adept_bag:
    title_ru: "Сумка опытного лекаря"
    title_en: "Adept Healer Bag"
    summary_ru: "Скрафтите «Сумку опытного лекаря» в Лазарете (навык ≥3) и сдайте в Ратушу — снимает тяжёлые травмы."
    summary_en: "Craft an Adept Healer Bag at the Infirmary (skill ≥3) and turn it in — clears heavy injuries."
    where_ru: "Лазарет Угля"
    where_en: "Coal Infirmary"
    giver: "Ратуша Угля"
    requires: [ash_healer_first_bag, tar_field_kit_contract]
    objective:
      type: deliver_item
      item_key: healer_bag_heavy
      count: 1
    reward:
      experience: 55
      currency_nv: 40
      item_key: ash_herb
    unlocks: [ash_healer_master_bag]
    sort: 7

  ash_healer_master_bag:
    title_ru: "Сумка мастера-лекаря"
    title_en: "Master Healer Bag"
    summary_ru: "Скрафтите «Сумку мастера-лекаря» (опыт + полевой набор + травы, навык ≥8) и сдайте — снимает боевую травму от PvP."
    summary_en: "Craft a Master Healer Bag (adept + field kit + herbs, skill ≥8) and turn it in — clears combat trauma from PvP."
    where_ru: "Лазарет Угля"
    where_en: "Coal Infirmary"
    giver: "Ратуша Угля"
    requires: [ash_healer_adept_bag]
    objective:
      type: deliver_item
      item_key: healer_bag_combat
      count: 1
    reward:
      experience: 80
      currency_nv: 60
      item_key: combat_heal_scroll
    unlocks: [veil_patrol_sweep]
    sort: 8

  ash_mite_patrol:
    title_ru: "Пепельный дозор"
    title_en: "Ash Mite Patrol"
    summary_ru: "Уничтожьте трёх пепельных клещей (plague_rat / у ворот) и доложите в Ратушу."
    summary_en: "Defeat three ash mites (plague_rat / gate) and report to City Hall."
