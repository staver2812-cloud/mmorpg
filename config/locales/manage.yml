      help_city_data_html: "Стабильные ключи — в <code>city_key</code> и <code>city_node_key</code>. Сцена — в <code>city_presentation</code>: смещение изображения, фокус и опциональные ориентиры."
      help_building_metadata_html: "Городские ворота используют зону/x/y назначения. Деревни — проверенный объект <code>location</code> с размером сцены и полигонами. Входы в шахты можно ставить, но держите их неактивными, пока интерьеры не зафиксированы и не реализованы."
      help_hotspot_params_html: "<code>enter_zone</code> использует destination_x/y и необязательное направление. <code>open_feature</code> — allowlisted ключ: arena, shop, market, airship_station или hospital."
      help_world_cell_metadata_html: "Расширенные свойства клетки и ссылки на источники. Действия и группы ресурсов — ниже. Для арта клетки нужен <code>source_map</code>."
      help_action_unimplemented: "Действие можно задать; игрокам оно недоступно, пока не реализован наблюдаемый gameplay-поток."
      help_resource_groups: "Идентичности групп описывают контент клетки. Они не выдают предметы и не задают количества, навыки или результат сбора."
      help_npc_template_html: "Боевые значения явны: например <code>health</code>, <code>base_damage</code>, <code>xp_reward</code>, <code>loot_table</code> и опциональный респавн."
      help_tile_npc_metadata: "Расширенные данные столкновения, окна пассивной задержки и ссылки на источники. Активацию, размер и составы меняйте отдельными полями."
      help_tile_npc_rosters: "Без составов действуют шаблон, уровень и размер выше. С составами выбирается одна полная группа. Деактивация сохраняет все данные."
      help_roster_members: "Заполните 1–10 участников; пустые строки не используются. Точный уровень или пара min/max. Диапазон требует явного HP и не масштабирует боевые статы. Пустой вес = 1."
