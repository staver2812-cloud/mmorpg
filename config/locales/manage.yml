    pipeline_body_html: "<code>TileStateResolver</code> composes managed world cells, buildings, NPC placements, and local actions. <code>ActionOfferBuilder</code> issues short-lived capabilities from that resolved state. City nodes and city actions use the same persisted-zone and offer boundaries."
    pipeline_note: "Changes take effect on the next server render. Existing live offers targeting edited or deleted content are cancelled automatically."
