      help_city_data_html: "Stable keys live in <code>city_key</code> and <code>city_node_key</code>. Scene presentation uses <code>city_presentation</code> with image offset, focus, and optional landmarks."
      help_building_metadata_html: "City gates use destination zone/x/y. Villages use a validated <code>location</code> object with scene size and feature polygons. Mine entrances can be placed now but must remain inactive until their interiors are observed and implemented."
      help_hotspot_params_html: "<code>enter_zone</code> uses destination_x/y and optional direction. <code>open_feature</code> uses an allowlisted feature key such as arena, shop, market, airship_station, or hospital."
      help_world_cell_metadata_html: "Advanced cell properties and source references. Edit actions and resource groups below. Cell art also requires <code>source_map</code>."
      help_action_unimplemented: "This action can be authored; it stays unavailable to players until its observed gameplay flow is implemented."
      help_resource_groups: "Group identities describe this cell's authored content. They do not grant items or define quantities, skill requirements, or harvest outcomes."
      help_npc_template_html: "Combat values remain explicit: for example <code>health</code>, <code>base_damage</code>, <code>xp_reward</code>, <code>loot_table</code>, and optional respawn timing."
      help_tile_npc_metadata: "Advanced encounter data, captured passive delay windows and source references. Edit activation, fixed size, and complete rosters with their dedicated controls."
      help_tile_npc_rosters: "Without rosters, the fixed template, level and size above apply. With rosters, one complete group is selected. Deactivation preserves all authored data."
      help_roster_members: "Fill 1–10 members; leave unused rows blank. Use an exact level or a minimum/maximum pair. A range requires explicit HP and does not scale combat stats. Blank weight means 1; weights describe the authored local policy."
